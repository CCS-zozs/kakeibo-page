<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>シンプルな家計簿</title>
    <link rel="stylesheet" href="style.css" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <header>
      <h1>シンプルな家計簿</h1>
      <h2>収入と支出を簡単に記録</h2>
      <p>日々の収入と支出を記録しましょう。</p>
    </header>

    <main>
      <section aria-labelledby="summary-heading">
        <h2 id="summary-heading">合計金額</h2>
        <p>家計簿記録の登録：<output aria-label="収支合計">¥0</output></p>
      </section>

      <section aria-labelledby="entry-heading">
        <h2 id="entry-heading">記録を追加</h2>
        <p
          id="app-status"
          class="app-status"
          role="status"
          aria-live="polite"
          hidden
        ></p>
        <form>
          <p>
            <label for="entry-date">日付</label>
            <input id="entry-date" name="date" type="date" required />
          </p>
          <p>
            <label for="entry-item">品目</label>
            <input
              id="entry-item"
              name="item"
              type="text"
              autocomplete="off"
              required
            />
          </p>
          <p>
            <label for="entry-type">収支</label>
            <select id="entry-type" name="type" required>
              <option value="expense">支出</option>
              <option value="income">収入</option>
            </select>
          </p>
          <p>
            <label for="entry-amount">金額（円）</label>
            <input
              id="entry-amount"
              name="amount"
              type="number"
              min="1"
              step="1"
              inputmode="numeric"
              required
            />
          </p>
          <button type="submit">追加しましょう</button>
        </form>
      </section>

      <section aria-labelledby="list-heading">
        <h2 id="list-heading">記録一覧</h2>
        <table>
          <thead>
            <tr>
              <th scope="col">日付</th>
              <th scope="col">品目</th>
              <th scope="col">収支</th>
              <th scope="col">金額</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="4">記録はまだありません。</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </body>
</html>
